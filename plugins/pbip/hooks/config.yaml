# PBIP hook configuration. Every check is on unless set to false here; changes apply immediately.

# Master switch for every hook in this plugin. Turn off if Windows shows noisy
# "PostToolUse hook error" notices (see README.md, Known Windows issues).
all_hooks_enabled: true

# JSON syntax of every file in *.Report/ (jq empty)
json_syntax: true

# Page and visual folder and name rule: letters, digits, underscore or hyphen, at most 50 characters
name_format: true

# Run pbir validate on the report after a PBIR edit when pbir is installed; only errors in the edited file block
pbir_validate: true

# Fallback when pbir is missing: required properties and $schema prefix per file type
required_fields: true

# definition.pbir byPath target folder must exist
bypath_exists: true

# Ask Fabric (fab exists) whether a byConnection model exists. Needs fab and a signed-in session; makes a network call.
fab_exists: false

# Run te validate on the semantic model after a .tmdl edit when te is installed
tmdl_validate: true
