# Hook toggles for the pbi-desktop plugin. Set a key to false (or off) to disable. Changes apply immediately.

# Master switch for every hook in this plugin
all_hooks_enabled: true

# After a command that saves model changes, run `te validate --local --errors-only`; a validation error is fed back to the agent
model_validation: true

# After the same commands, report visible measures without description, display folder or format string (a note only, never blocks)
measure_metadata: true
